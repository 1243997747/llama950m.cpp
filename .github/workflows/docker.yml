# 云端编译 llama.cpp CUDA 镜像（GTX 950M / sm_50）
#
# 使用步骤:
#   1. 在 GitHub 新建一个仓库（建议 Public，GHCR 存储免费无限制）
#   2. 把 llama-docker 目录内容（Dockerfile + .github/）推上去
#   3. Actions 会自动触发编译，产物推送到 ghcr.io/<你的用户名>/llama-cuda-950m
#   4. 目标机器上直接拉取运行:
#        docker pull ghcr.io/<你的用户名>/llama-cuda-950m:latest
#
# 说明:
#   - CUDA 编译只需要 nvcc，不需要 GPU，云端 runner 完全胜任
#   - 想换 CUDA 版本: 手动触发时选 11.8 即可（见下方 workflow_dispatch）
#   - 想固定 llama.cpp 版本: 修改下方 env 里的 LLAMA_TAG

name: build-cuda-image

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA 版本（驱动<12.2 时用 11.8.0）"
        default: "12.2.0"
        required: false
      llama_tag:
        description: "llama.cpp 版本 tag（留空则用 master）"
        default: ""
        required: false

env:
  REGISTRY: ghcr.io
  # 改成你的 GitHub 用户名/组织名
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build args
        id: args
        run: |
          CUDA="${{ github.event.inputs.cuda_version }}"
          TAG="${{ github.event.inputs.llama_tag }}"
          echo "cuda=${CUDA:-12.2.0}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-master}" >> "$GITHUB_OUTPUT"

      # GHCR 要求镜像名全小写
      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # load=true 同时把镜像导入本地 daemon，供下方 docker save 导出
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:cuda-${{ steps.args.outputs.cuda }}
          build-args: |
            CUDA_VERSION=${{ steps.args.outputs.cuda }}
            LLAMA_TAG=${{ steps.args.outputs.tag }}
          # 利用 Actions 缓存加速重复编译（apt 层 + cmake 层）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 导出镜像 tar 制品：目标机器 docker load 即用，无需访问 GHCR
      - name: Export image tar
        run: |
          docker tag ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest llama-cuda-950m:latest
          docker save llama-cuda-950m:latest | gzip -1 > llama-cuda-950m.tar.gz
          ls -lh llama-cuda-950m.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-950m-image
          path: llama-cuda-950m.tar.gz
          retention-days: 7
